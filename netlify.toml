[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]

[functions."blog-ai-schedule"]
  schedule = "0 6 * * *"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
