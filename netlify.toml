[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]

[functions."blog-ai-schedule"]
  schedule = "0 * * * *"

# Exact path first — must run before SPA catch-all redirects
[[edge_functions]]
  function = "sitemap"
  path = "/sitemap.xml"

[[edge_functions]]
  function = "blog-redirect"
  path = "/*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
